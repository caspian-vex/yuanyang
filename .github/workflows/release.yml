name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/deploy.sh --help
          bash scripts/test-deploy.sh
          if bash scripts/deploy.sh --source --version v0.1.0; then exit 1; fi
          if bash scripts/deploy.sh --release --ref main; then exit 1; fi
      - run: bash scripts/build.sh
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: yuanyang-linux-amd64
          path: dist/*
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yuanyang-linux-amd64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.0-build.{0}.{1}', github.run_number, github.run_attempt) }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --latest
          elif [[ "$SOURCE_REF" == refs/tags/v* ]]; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --latest
          else
            gh release create "$RELEASE_TAG" dist/* --target "$SOURCE_SHA" --generate-notes --latest
          fi
